<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuenta confirmada — Carmina</title>
<style>
  :root { color-scheme: light dark;
    --papel:#FCFBF8; --tinta:#1F1B19; --suave:#6B625D; --carmin:#D32B37; --filete:#E7E1D8; }
  @media (prefers-color-scheme: dark) {
    :root { --papel:#16120F; --tinta:#EDE7DF; --suave:#A89E95; --carmin:#E9636E; --filete:#322C26; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--papel); color:var(--tinta); padding:32px 22px;
    font:16.5px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:28rem; text-align:center; }
  .marca { color:var(--carmin); font-size:2rem; font-weight:700; letter-spacing:.5px;
    font-family:Georgia,"Times New Roman",serif; margin:0 0 28px; }
  h1 { font-size:1.5rem; line-height:1.25; margin:0 0 10px; }
  p { color:var(--suave); margin:0 0 22px; }
  .aviso { border:1px solid var(--filete); border-radius:14px; padding:16px 18px;
    text-align:left; font-size:.95rem; color:var(--suave); }
  .aviso strong { color:var(--tinta); }
</style>
</head>
<body>
<main>
  <p class="marca">Carmina</p>
  <h1>Tu cuenta quedó confirmada</h1>
  <p>Ya puedes volver a Carmina e iniciar sesión con tu correo y tu contraseña.</p>
  <div class="aviso">
    <strong>Cierra esta página y abre la aplicación.</strong><br>
    Si abriste este enlace en la computadora, no pasa nada: la cuenta ya está
    confirmada y funciona igual en tu teléfono.
  </div>
</main>
</body>
</html>
